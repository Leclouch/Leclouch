<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Future Gadget Lab terminal</title>
  <desc id="desc">A muted green CRT-style information terminal for Leclouch's GitHub profile.</desc>
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#8aff80" opacity=".035"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" rx="12" fill="#0b0f0c"/>
  <rect x="1" y="1" width="998" height="298" rx="11" fill="none" stroke="#315b32" stroke-width="2"/>
  <rect width="1000" height="300" rx="12" fill="url(#scanlines)"/>

  <g font-family="monospace" fill="#c8facc">
    <text x="38" y="47" font-size="18" letter-spacing="2" fill="#8aff80" filter="url(#glow)">FUTURE GADGET LAB // TERMINAL_001</text>
    <text x="38" y="75" font-size="13" fill="#75d66b">STATUS: ONLINE</text>
    <circle cx="163" cy="70" r="6" fill="#8aff80" filter="url(#glow)"/>
    <text x="750" y="75" font-size="13" fill="#75d66b">WORLD LINE: 1.048596</text>

    <line x1="38" y1="95" x2="962" y2="95" stroke="#315b32"/>
    <line x1="500" y1="122" x2="500" y2="255" stroke="#315b32"/>

    <text x="38" y="130" font-size="13" fill="#75d66b">PRIMARY RESEARCH</text>
    <text x="38" y="163" font-size="18">[01] COMPUTER VISION</text>
    <text x="38" y="192" font-size="18">[02] AUTONOMOUS ROBOTICS</text>
    <text x="38" y="221" font-size="18">[03] APPLIED AI + HARDWARE</text>

    <text x="535" y="130" font-size="13" fill="#75d66b">ACTIVE TRANSMISSION</text>
    <text x="535" y="163" font-size="17">BUILDING THINGS</text>
    <text x="535" y="192" font-size="17">THE ORGANIZATION</text>
    <text x="535" y="221" font-size="17">SHOULD NOT FIND.</text>
    <text x="535" y="255" font-size="12" fill="#75d66b">&gt; await divergence.shift()</text>
  </g>
</svg>
